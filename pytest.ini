[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=genome
    --cov=downloader
    --cov=builder
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    -v
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that might download data


