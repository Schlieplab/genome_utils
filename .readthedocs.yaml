# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Full clone so that the version/tag information is available.
      - git fetch --unshallow || true

sphinx:
  configuration: docs/conf.py
  # Fail the build on warnings (broken references, missing documents, ...).
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
