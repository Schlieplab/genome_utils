[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "GenomeUtils"
version = "0.1.0"
description = "An object-oriented Python library for working with genomic data."
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "gffutils",
    "requests",
    "biopython",
    "gget",
]

[tool.setuptools.packages.find]
include = ["GenomeUtils*"]
